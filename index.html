<canvas id="c"></canvas>
<script>
const T = 16, VW = 40, VH = 20;        // tile size, view size (tiles)
const PGW = 20, PGH = 10;              // page size (view shifts in these steps)
const PLW = 2, PLH = 3;                // player size
const COLORS = ['#000','#00f','#0f0','#0ff','#f00','#a0f','#ff0','#fff'];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = VW*T; cv.height = VH*T;

let world, flat = [];
let save  = JSON.parse(localStorage.getItem('plat3bit')   || '{}');   // best stars per level id
let times = JSON.parse(localStorage.getItem('plat3bit_t') || '{}');   // best time (s) per level id
let cur, orig, map, w, h, total, got, start, spawn, gate, arch;
let p, cam = {x:0, y:0}, won = false, ready = false, keys = {};
let ticks = 0, running = false;
const menu = {open:false, col:0, sel:[0,0,0]};

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pct = () => total ? got/total : 1;
const stars = () => Object.values(save).reduce((a,b) => a+b, 0);
const lvlId = (L,A,V) => `${L+1}-${A+1}-${V+1}`;
const areaOpen = (L,A) => stars() >= world.lands[L].areas[A].starsToUnlock;
const lvlOpen = (L,A,V) => areaOpen(L,A) && (V === 0 || lvlId(L,A,V-1) in save);
const fmt = s => Math.floor(s/60) + ':' + (s%60).toFixed(2).padStart(5,'0');
const sumTime = f => { let s = 0; for (const e of flat) if (f(e)) { if (!(e.id in times)) return null; s += times[e.id]; } return s; };
const showT = s => s === null ? '--' : fmt(s);

function persist() {
  localStorage.setItem('plat3bit', JSON.stringify(save));
  localStorage.setItem('plat3bit_t', JSON.stringify(times));
}

// ---------- save import / export ----------
function exportSave() {
  const code = btoa(JSON.stringify({v:1, stars:save, times}));
  navigator.clipboard?.writeText(code).catch(() => {});
  prompt('Your save code (copied if your browser allows):', code);
}
function importSave() {
  const code = prompt('Paste your save code:');
  if (!code) return;
  try {
    const d = JSON.parse(atob(code.trim()));
    if (!d || typeof d.stars !== 'object' || typeof d.times !== 'object') throw 0;
    const ok = /^\d+-\d+-\d+$/;
    for (const [id, s] of Object.entries(d.stars || {}))
      if (ok.test(id) && [0,1,2].includes(s)) save[id] = Math.max(save[id] ?? 0, s);
    for (const [id, t] of Object.entries(d.times || {}))
      if (ok.test(id) && typeof t === 'number' && t > 0 && t < 1e6) times[id] = Math.min(times[id] ?? Infinity, t);
    persist();
    alert('Save imported.');
  } catch { alert('That save code is not valid.'); }
}

// ---------- loading ----------
fetch('levels.json').then(r => r.json()).then(j => {
  world = j;
  world.lands.forEach((land,L) => land.areas.forEach((area,A) =>
    area.levels.forEach((path,V) => flat.push({L,A,V,path,id:lvlId(L,A,V)}))));
  loadLevel(flat.find(e => lvlOpen(e.L,e.A,e.V) && !(e.id in save)) || flat[0]);
  setInterval(tick, 1000/30);
  draw();
});

function loadLevel(e) {
  keys = {}; ready = false; cur = e; menu.sel = [e.L, e.A, e.V];
  const img = new Image();
  img.onload = () => {
    w = img.width; h = img.height;
    const o = document.createElement('canvas'); o.width = w; o.height = h;
    const oc = o.getContext('2d'); oc.drawImage(img, 0, 0);
    const d = oc.getImageData(0, 0, w, h).data;
    orig = []; total = 0; start = null;
    gate = {x1:1e9, y1:1e9, x2:-1, y2:-1};
    for (let y = 0; y < h; y++) { orig[y] = [];
      for (let x = 0; x < w; x++) { const i = (y*w+x)*4;
        const v = (d[i]>=128?4:0)|(d[i+1]>=128?2:0)|(d[i+2]>=128?1:0);
        orig[y][x] = v;
        if (v === 6) total++;
        if (v === 1 && !start) start = {x, y};          // top-left of start gate
        if (v === 2) { gate.x1=Math.min(gate.x1,x); gate.y1=Math.min(gate.y1,y);
                       gate.x2=Math.max(gate.x2,x); gate.y2=Math.max(gate.y2,y); }
      }}
    // red arch around the end gate (top + both sides)
    arch = [];
    if (gate.x2 >= 0) {
      for (let x = gate.x1-1; x <= gate.x2+1; x++) arch.push([x, gate.y1-1]);
      for (let y = gate.y1; y <= gate.y2; y++) { arch.push([gate.x1-1, y]); arch.push([gate.x2+1, y]); }
    }
    restart(); ready = true;
  };
  img.src = e.path;
}

function setArch() {
  const on = pct() < 0.7;
  for (const [x,y] of arch) if (orig[y]?.[x] === 0) map[y][x] = on ? 4 : 0;
}
function restart() {
  map = orig.map(r => [...r]);
  got = 0; won = false; spawn = {...start};
  ticks = 0; running = false;
  setArch(); respawn();
}
function respawn() { p = {x:spawn.x, y:spawn.y, vy:0, ry:0}; snapCam(true); }

// ---------- camera (page-style) ----------
function snapCam(force) {
  const cx = p.x + PLW/2, cy = p.y + PLH/2;
  if (force || cx-cam.x < 10 || cam.x+VW-cx < 10)
    cam.x = clamp(Math.round((cx-VW/2)/PGW)*PGW, 0, Math.max(0, w-VW));
  if (force || cy-cam.y < 5 || cam.y+VH-cy < 5)
    cam.y = clamp(Math.round((cy-VH/2)/PGH)*PGH, 0, Math.max(0, h-VH));
}

// ---------- input ----------
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)) e.preventDefault();
  if (!world) return;
  if (k === 'p') { keys = {}; menu.open = !menu.open; if (menu.open && cur) menu.sel = [cur.L, cur.A, cur.V]; return; }
  if (menu.open) return menuKey(e.key);
  keys[k] = true;
  if (k === 'r' && ready) { keys = {}; restart(); }
  if (e.key === 'Enter' && won) nextLevel();
});
addEventListener('keyup', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
});
addEventListener('blur', () => keys = {});
document.addEventListener('visibilitychange', () => keys = {});

function menuKey(k) {
  if (k === 'e' || k === 'E') return exportSave();
  if (k === 'i' || k === 'I') return importSave();
  const L = menu.sel[0], A = menu.sel[1];
  const len = [world.lands.length, world.lands[L].areas.length, world.lands[L].areas[A].levels.length];
  if (k === 'ArrowLeft') menu.col = Math.max(0, menu.col-1);
  if (k === 'ArrowRight') menu.col = Math.min(2, menu.col+1);
  if (k === 'ArrowDown' || k === 'ArrowUp') {
    const c = menu.col;
    menu.sel[c] = clamp(menu.sel[c] + (k === 'ArrowDown' ? 1 : -1), 0, len[c]-1);
    for (let i = c+1; i < 3; i++) menu.sel[i] = 0;
  }
  if (k === 'Enter') {
    if (menu.col < 2) menu.col++;
    else if (lvlOpen(L, A, menu.sel[2])) {
      loadLevel(flat.find(e => e.L === L && e.A === A && e.V === menu.sel[2]));
      menu.open = false;
    }
  }
}

function nextLevel() {
  const n = flat[flat.indexOf(cur)+1];
  if (n && lvlOpen(n.L, n.A, n.V)) loadLevel(n);
  else { menu.open = true; menu.sel = [cur.L, cur.A, cur.V]; }
}

// ---------- game logic ----------
const tile = (x, y) => (x < 0 || x >= w) ? 7 : (y < 0 || y >= h ? 0 : map[y][x]);
function blocked(px, py) {
  for (let j = 0; j < PLH; j++) for (let i = 0; i < PLW; i++)
    if (tile(px+i, py+j) === 7) return true;
  return false;
}

function tick() {
  if (!ready || menu.open || won) return;
  const dir = (keys.ArrowRight||keys.d ? 1 : 0) - (keys.ArrowLeft||keys.a ? 1 : 0);
  const jump = keys.ArrowUp || keys.w || keys[' '];
  if (!running && (dir || jump)) running = true;
  if (running) ticks++;

  if (dir && !blocked(p.x+dir, p.y)) p.x += dir;
  if (jump && blocked(p.x, p.y+1)) p.vy = -1.2;      // jump strength (~4 blocks)
  p.vy = Math.min(p.vy + 0.15, 2);                   // gravity, terminal velocity
  p.ry += p.vy;
  while (Math.abs(p.ry) >= 1) {
    const s = Math.sign(p.ry);
    if (blocked(p.x, p.y+s)) { p.vy = 0; p.ry = 0; break; }
    p.y += s; p.ry -= s;
  }
  interact();
  if (!won) snapCam(false);
}

function interact() {
  if (p.y >= h) { respawn(); return; }
  for (let j = 0; j < PLH; j++) for (let i = 0; i < PLW; i++) {
    const x = p.x+i, y = p.y+j, v = tile(x, y);
    if (v === 4) { respawn(); return; }                        // trap
    if (v === 3) spawn = {x:p.x, y:p.y};                       // checkpoint
    if (v === 6) { map[y][x] = 0; got++; setArch(); }          // coin
    if (v === 2 && pct() >= 0.7) {                             // end gate
      won = true;
      const s = pct() >= 1 ? 2 : pct() >= 0.9 ? 1 : 0;
      save[cur.id] = Math.max(save[cur.id] ?? 0, s);
      const tm = ticks/30;
      if (!(cur.id in times) || tm < times[cur.id]) times[cur.id] = tm;
      persist();
      return;
    }
  }
}

// ---------- drawing ----------
function label(t, x, y) {
  ctx.font = '12px monospace';
  const m = ctx.measureText(t).width;
  ctx.fillStyle = '#000'; ctx.fillRect(x, y, m+8, 18);
  ctx.fillStyle = '#fff'; ctx.fillText(t, x+4, y+13);
}

function drawMenu() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = '12px monospace'; ctx.fillStyle = '#fff';
  ctx.fillText('Stars: ' + stars() + '   Arrows + Enter   P: close   E: export   I: import', 10, 16);
  const [L, A] = menu.sel;
  const cols = [
    world.lands.map((l,i) => ({t:l.name, ok:areaOpen(i,0)})),
    world.lands[L].areas.map((a,i) => ({t:a.name + (areaOpen(L,i) ? '' : ` (${a.starsToUnlock}★)`), ok:areaOpen(L,i)})),
    world.lands[L].areas[A].levels.map((_,i) => { const id = lvlId(L,A,i);
      return {t:id + (id in save ? ' ✓' + '★'.repeat(save[id]) : '') + (id in times ? ' ' + fmt(times[id]) : ''), ok:lvlOpen(L,A,i)}; })
  ];
  cols.forEach((list, c) => list.forEach((it, i) => {
    const x = 20 + c*210, y = 40 + i*14;
    if (menu.sel[c] === i) { ctx.fillStyle = c === menu.col ? '#a0f' : '#333'; ctx.fillRect(x-4, y-11, 190, 14); }
    ctx.fillStyle = it.ok ? '#fff' : '#666';
    ctx.fillText(it.t, x, y);
  }));
  ctx.fillStyle = '#fff';
  ctx.fillText('Land total: ' + showT(sumTime(e => e.L === L)), 20, cv.height-30);
  ctx.fillText('Area total: ' + showT(sumTime(e => e.L === L && e.A === A)), 20, cv.height-14);
}

function draw() {
  if (menu.open) drawMenu();
  else if (ready) {
    for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
      ctx.fillStyle = COLORS[map[cam.y+y]?.[cam.x+x] ?? 0];
      ctx.fillRect(x*T, y*T, T, T);
    }
    ctx.fillStyle = COLORS[5];
    ctx.fillRect((p.x-cam.x)*T, (p.y-cam.y)*T, PLW*T, PLH*T);
    label(`${cur.id}  ${Math.floor(pct()*100)}%` + (pct()>=0.9 ? ' ★' : '') + (pct()>=1 ? '★' : ''), 4, 4);
    label(fmt(ticks/30), cv.width-66, 4);
    if (won) label('LEVEL CLEAR  Enter: next  R: retry  P: menu', 4, 26);
  }
  requestAnimationFrame(draw);
}
</script>
